<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Predict — AI Churn Predictor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% include 'sidebar.html' %}
  <main class="main">
    <p class="page-title">Enter Customer Details</p>
    <p class="page-sub">Fill in the user's subscription behaviour to predict churn probability.</p>

    <div class="card">
      <form method="POST" action="/predict">
        <div class="predict-grid">

          <!-- Usage Duration -->
          <div class="form-group">
            <label>Usage Duration</label>
            <select name="usage_duration" required>
              <option value="">Select duration</option>
              <option value="0-3 months">0–3 months</option>
              <option value="3-6 months">3–6 months</option>
              <option value="6-12 months">6–12 months</option>
              <option value="12+ months">12+ months</option>
            </select>
          </div>

          <!-- Experience Rating -->
          <div class="form-group">
            <label>Experience Rating</label>
            <div class="stars" id="stars">
              <span class="star active" data-val="1">★</span>
              <span class="star active" data-val="2">★</span>
              <span class="star active" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star" data-val="5">★</span>
            </div>
            <input type="hidden" name="experience_rating" id="rating_val" value="3">
          </div>

          <!-- Subscription Plan -->
          <div class="form-group">
            <label>Subscription Plan</label>
            <select name="subscription_plan" required>
              <option value="">Select plan</option>
              <option value="Free">Free</option>
              <option value="Basic">Basic</option>
              <option value="Pro">Pro</option>
              <option value="Enterprise">Enterprise</option>
            </select>
          </div>

          <!-- Last Active -->
          <div class="form-group">
            <label>Last Active</label>
            <select name="last_active" required>
              <option value="">Select last active</option>
              <option value="Today">Today</option>
              <option value="1-3 days">1–3 days ago</option>
              <option value="4-7 days">4–7 days ago</option>
              <option value="8-14 days">8–14 days ago</option>
              <option value="15+ days">15+ days ago</option>
            </select>
          </div>

          <!-- Daily Activity -->
          <div class="form-group">
            <label>Daily Activity (Messages)</label>
            <div class="slider-row">
              <input type="range" name="daily_activity" id="activity_slider"
                     min="0" max="100" value="20"
                     oninput="document.getElementById('activity_val').textContent=this.value">
              <span class="slider-val" id="activity_val">20</span>
            </div>
          </div>

          <!-- Session Length -->
          <div class="form-group">
            <label>Session Length (Minutes)</label>
            <select name="session_length" required>
              <option value="">Select session length</option>
              <option value="&lt;5 min">&lt; 5 minutes</option>
              <option value="5-15 min">5–15 minutes</option>
              <option value="15-30 min">15–30 minutes</option>
              <option value="30+ min">30+ minutes</option>
            </select>
          </div>

          <!-- Usage Frequency -->
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Usage Frequency (Active Days/Week)</label>
            <div class="toggle-group">
              <button type="button" class="toggle-btn"
                      onclick="setFreq(this,'Low (1-2)')">Low</button>
              <button type="button" class="toggle-btn active"
                      onclick="setFreq(this,'Medium (3-4)')">Medium</button>
              <button type="button" class="toggle-btn"
                      onclick="setFreq(this,'High (5-7)')">High</button>
            </div>
            <input type="hidden" name="usage_frequency" id="freq_val" value="Medium (3-4)">
          </div>

        </div>

        <div class="form-footer">
          <button type="submit" class="btn-primary" style="width:100%;justify-content:center;padding:16px;">
            Predict Churn
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Star rating
    const stars = document.querySelectorAll('.star');
    stars.forEach(s => s.addEventListener('click', () => {
      const v = +s.dataset.val;
      document.getElementById('rating_val').value = v;
      stars.forEach(x => x.classList.toggle('active', +x.dataset.val <= v));
    }));

    // Frequency toggle
    function setFreq(btn, val) {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('freq_val').value = val;
    }
  </script>
</body>
</html>
